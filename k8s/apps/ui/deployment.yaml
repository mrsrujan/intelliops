apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: intelliops/ui:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              value: "http://order-service-order-service:8080"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service-payment-service:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - port: 8080
      targetPort: 8080
